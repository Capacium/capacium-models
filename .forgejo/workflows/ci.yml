name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Forgejo Actions: fully-qualified action URLs (instance DEFAULT_ACTIONS_URL
# is code.forgejo.org); runs-on ubuntu-latest → catthehacker act image.
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: https://github.com/actions/checkout@v4
      - uses: https://github.com/actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install .[dev]
      - name: Test
        run: pytest -v
