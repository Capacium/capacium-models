name: Publish to PyPI

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    # Forgejo is canonical. This workflow is mirrored with the tag and runs
    # only on GitHub, whose OIDC identity is registered with PyPI.
    if: ${{ github.server_url == 'https://github.com' }}
    name: Test and build distributions
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate tag matches package version
        shell: bash
        run: |
          package_version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          test "${GITHUB_REF_NAME}" = "v${package_version}"
      - name: Install build and test dependencies
        run: python -m pip install --upgrade build pytest
      - name: Run tests
        run: python -m pip install . && python -m pytest -q
      - name: Build sdist and wheel
        run: python -m build
      - name: Upload dist artifacts
        uses: actions/upload-artifact@v4
        with:
          name: python-dist
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/capacium-models
    permissions:
      id-token: write

    steps:
      - name: Download dist artifacts
        uses: actions/download-artifact@v4
        with:
          name: python-dist
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
