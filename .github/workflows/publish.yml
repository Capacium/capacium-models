name: Publish to PyPI

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing release tag to build and publish (for recovery only)"
        required: true
        type: string

concurrency:
  group: pypi-${{ inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}

jobs:
  build:
    # Forgejo is canonical. This workflow is mirrored with the tag and runs
    # only on GitHub, whose OIDC identity is registered with PyPI.
    if: ${{ github.server_url == 'https://github.com' }}
    name: Test and build distributions
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          # A manual recovery run loads this workflow from main but builds the
          # exact, already-existing release tag supplied by the maintainer.
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
      # Dispatch gates, before anything is built or published (EP-014): a manual
      # run must name a tag that matches the release pattern v* and that exists
      # on origin. On a tag push these steps are skipped (the trigger filter
      # already bounds the ref), so a tag push behaves exactly as before.
      - name: Validate the release tag pattern
        if: ${{ github.event_name == 'workflow_dispatch' }}
        shell: bash
        run: |
          set -euo pipefail
          case "${RELEASE_TAG}" in
            v*) ;;
            *)
              echo "TagPatternError: release tag '${RELEASE_TAG}' does not match 'v*'; refusing before any publish." >&2
              exit 2
              ;;
          esac
          echo "release tag pattern validated: ${RELEASE_TAG}"
      - name: Verify the release tag exists on origin
        if: ${{ github.event_name == 'workflow_dispatch' }}
        shell: bash
        run: |
          set -euo pipefail
          found="$(git ls-remote --tags --refs origin "refs/tags/${RELEASE_TAG}")"
          if [ -z "${found}" ]; then
            echo "UnknownReleaseTagError: tag '${RELEASE_TAG}' does not exist on origin; refusing before any publish." >&2
            exit 2
          fi
          echo "release tag verified on origin: ${RELEASE_TAG} -> ${found}"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate tag matches package version
        shell: bash
        run: |
          [[ "${RELEASE_TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]
          git show-ref --verify --quiet "refs/tags/${RELEASE_TAG}"
          package_version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          test "${RELEASE_TAG}" = "v${package_version}"
      - name: Install build and test dependencies
        run: python -m pip install --upgrade build pytest
      - name: Run tests
        run: python -m pip install . && python -m pytest -q
      - name: Build sdist and wheel
        run: python -m build
      - name: Upload dist artifacts
        uses: actions/upload-artifact@v4
        with:
          name: python-dist
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/capacium-models
    permissions:
      id-token: write

    steps:
      - name: Download dist artifacts
        uses: actions/download-artifact@v4
        with:
          name: python-dist
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  # The release objects, on both declared destinations (EP-014). A job of its
  # own so the PyPI publish above is untouched: this job reads only the dist
  # the build job produced and hands it to ops_engine.release_attach, which
  # finds or creates the Forgejo and the GitHub release for the tag, converges
  # the title and the body, and attaches the wheel and the sdist, verifying the
  # declared asset set on read-back (REA-014/REA-015). The same guard as the
  # build job: this workflow is mirrored with the tag and runs only on GitHub.
  attach-release:
    name: Attach the dist to the release objects
    needs: build
    if: ${{ github.server_url == 'https://github.com' }}
    runs-on: ubuntu-latest

    steps:
      # The dist was built by the build job from the tag tree (its checkout is
      # pinned to env.RELEASE_TAG on both trigger kinds). This job checks out
      # the same tag so the CHANGELOG notes, and on a tag push the .ops.yaml,
      # come from the tagged tree. On a manual dispatch of an existing tag the
      # .ops.yaml is overlaid from the default branch below; the dist and the
      # notes stay the tag tree's, so a backfill attaches the tagged build.
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - name: Download dist artifacts
        uses: actions/download-artifact@v4
        with:
          name: python-dist
          path: dist/
      # A manual dispatch checks out the tag, and an older tag's tree may
      # predate this release block, so the engine would read no
      # release.name_template and rewrite an existing release title. On a
      # dispatch, overlay .ops.yaml from the default branch (fetched, not the
      # tag tree) so the release block, the destinations, forge_hosts and
      # name_template are present. The dist downloaded above is still the tag
      # tree's build. A tag push leaves the tree as checked out.
      - name: Use the default branch .ops.yaml on a manual dispatch
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          DEFAULT_BRANCH: "${{ github.event.repository.default_branch }}"
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin "$DEFAULT_BRANCH"
          git checkout FETCH_HEAD -- .ops.yaml
          if ! grep -q '^release:' .ops.yaml; then
            echo "MissingReleaseBlockError: .ops.yaml from '$DEFAULT_BRANCH' has no release: block; refusing to attach with an empty name_template." >&2
            exit 2
          fi
          echo "using .ops.yaml from $DEFAULT_BRANCH ($(git rev-parse --short FETCH_HEAD))"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # The engine is pinned by version AND content hash: the version selects
      # the wheel URL, the hash is checked on the downloaded file before it is
      # installed, so a wheel whose bytes changed under a fixed version is
      # refused here rather than at publication.
      - name: Install the pinned ops-engine (v3.7.2, hash-verified)
        shell: bash
        run: |
          set -euo pipefail
          WHEEL_URL="https://github.com/LangeVC/ops-engine/releases/download/v3.7.2/ops_engine-3.7.2-py3-none-any.whl"
          WHEEL_SHA256="c58a5890c314db1e4ebe1ae2fb3a8b501d6bb81c6bc3797af39e57e02a26018f"
          WHEEL_DIR="$(mktemp -d)"
          WHEEL_FILE="$WHEEL_DIR/ops_engine-3.7.2-py3-none-any.whl"
          curl -fsSL "$WHEEL_URL" -o "$WHEEL_FILE"
          GOT="$(python3 -c 'import hashlib,sys; print(hashlib.sha256(open(sys.argv[1],"rb").read()).hexdigest())' "$WHEEL_FILE")"
          if [ "$GOT" != "$WHEEL_SHA256" ]; then
            echo "WheelHashError: ops-engine 3.7.2 wheel sha256 $GOT != pinned $WHEEL_SHA256" >&2
            exit 2
          fi
          echo "wheel sha256 verified: $GOT"
          ENGINE_VENV="$(mktemp -d)/engine-venv"
          python3 -m venv "$ENGINE_VENV"
          "$ENGINE_VENV/bin/python" -m pip install --quiet "$WHEEL_FILE"
          echo "ENGINE_VENV=$ENGINE_VENV" >> "$GITHUB_ENV"
      # Prove what was installed. The version is read back from the same
      # interpreter that runs the CLI below, so a wheel that installed but left
      # a stale version behind is named here rather than at publication.
      - name: Prove the pinned engine version
        shell: bash
        run: |
          set -euo pipefail
          "$ENGINE_VENV/bin/python" - <<'ENGINE_VERSION_PY'
          import importlib.metadata as md
          import sys

          REQUIRED = "3.7.2"
          got = md.version("ops-engine")
          if got != REQUIRED:
              sys.stderr.write(
                  "EngineVersionError: installed ops-engine %s, required %s.\n"
                  % (got, REQUIRED)
              )
              sys.exit(2)
          sys.stdout.write("engine: ops-engine %s\n" % got)
          ENGINE_VERSION_PY
      # The notes are the CHANGELOG entry for this tag, read by the engine's own
      # extractor, so the body the engine composes here is the body a layover
      # composes. Only --notes-file is passed as the body input: the product
      # heading is rendered from .ops.yaml's release.name_template and the
      # CHANGELOG link is derived by the engine from forge_hosts, so the
      # workflow restates neither. The Forgejo release repo, the canonical forge
      # host and the name template are all read from .ops.yaml (the declaration
      # of record), not restated here.
      - name: Attach the dist to the release on both forges
        shell: bash
        env:
          TAG_NAME: ${{ env.RELEASE_TAG }}
          GH_MIRROR_TOKEN: ${{ secrets.GH_MIRROR_TOKEN }}
          # The Forgejo destination is keyed by its declared credential_variable
          # (FORGEJO_TOKEN). On a GitHub runner that variable is supplied from
          # the run's own GITHUB_TOKEN, exactly as the capacium-bridge reference
          # does: a repo-level FORGEJO_TOKEN secret does not exist here, so
          # ${{ secrets.FORGEJO_TOKEN }} would resolve empty and adapters_for
          # would refuse the destination with MissingCredentialError.
          FORGEJO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Read the declaration of record once, through the engine's own loader,
          # so the repo selector, the canonical host and the title template are
          # never restated here. The three lines are the forgejo release
          # destination, forge_hosts[0] and release.name_template.
          CFG_FILE="$(mktemp)"
          "$ENGINE_VENV/bin/python" - > "$CFG_FILE" <<'CFG_PY'
          from ops_engine.config_loader import load_ops_yaml

          cfg = load_ops_yaml(".")
          rel = cfg.release
          fj = next(
              (d for d in (cfg.destinations or [])
               if d.forge == "forgejo" and d.role == "release"),
              None,
          )
          print(fj.repo if fj else "")
          print((cfg.forge_hosts or [""])[0])
          print((rel.name_template if rel else "") or "")
          CFG_PY
          { read -r FJ_REPO; read -r FJ_HOST; read -r NAME_TEMPLATE; } < "$CFG_FILE"
          rm -f "$CFG_FILE"
          if [ -z "$FJ_REPO" ] || [ -z "$FJ_HOST" ]; then
            echo "MissingReleaseConfigError: .ops.yaml declares no forgejo release destination or forge_hosts; refusing." >&2
            exit 2
          fi
          if [ -z "$NAME_TEMPLATE" ]; then
            echo "MissingReleaseNameTemplateError: .ops.yaml declares no release.name_template; a default title would rewrite the release, so the attach is refused." >&2
            exit 2
          fi
          # The Forgejo instance address the engine calls: derived from the
          # declared canonical host and exported explicitly (the CLI reads
          # FORGEJO_BASE_URL). It is the API address only; the CHANGELOG link is
          # derived by the engine from forge_hosts, not from this variable.
          export FORGEJO_BASE_URL="https://${FJ_HOST}"
          echo "forgejo base url: ${FORGEJO_BASE_URL} (repo ${FJ_REPO})"
          echo "name template: ${NAME_TEMPLATE}"

          NOTES_FILE="$(mktemp)"
          trap 'rm -f "$NOTES_FILE"' EXIT
          "$ENGINE_VENV/bin/python" - "$TAG_NAME" "$NOTES_FILE" <<'NOTES_PY'
          import sys

          from ops_engine.modules.release_gates import extract_changelog_section

          tag, out = sys.argv[1], sys.argv[2]
          with open("CHANGELOG.md", encoding="utf-8") as fh:
              notes = extract_changelog_section(fh.read(), tag)
          with open(out, "w", encoding="utf-8") as fh:
              fh.write(notes)
          NOTES_PY

          ls -l dist
          "$ENGINE_VENV/bin/python" -m ops_engine.release_attach \
            --repo "$FJ_REPO" \
            --tag "$TAG_NAME" \
            --artifacts dist \
            --repo-dir . \
            --name-template "$NAME_TEMPLATE" \
            --notes-file "$NOTES_FILE"
