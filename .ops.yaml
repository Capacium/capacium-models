# Layer-3 repository override (DST-002) for capacium-models: the release
# destinations. The forge is a value, not a key name (DST-001). The release
# workflow reads this file through config_loader.load_ops_yaml and resolves both
# destinations from it; no destination, forge repository, host or credential
# name is restated as a literal in .forgejo/ or .github/.
#
# Measured on 2026-11-17 (before EP-014): .github/workflows/publish.yml
# published to PyPI only and created no release object (it triggers on tags
# `v*`, runs only where github.server_url is https://github.com, and its last
# step was pypa/gh-action-pypi-publish); .forgejo/workflows/ holds ci.yml and
# mirror.yml, and neither creates a release. That left every release object
# with `assets: []` on both forges (EP-013 findings).
#
# EP-014 closes that gap here and in publish.yml: this file now declares the
# release block whole (the assets below), and publish.yml gains a job of its
# own that attaches those files through ops_engine.release_attach. The release
# block is read from this file by the attach CLI even when the layer-2 org
# config is absent, so this Layer-3 file is the declaration of record.
#
# Visibilities are the MEASURED state of each forge on 2026-11-17, not an
# inference from the Layer-2 mirror declaration in capacium-ops/config.yml:
#   - canonical Forgejo capacium/capacium-models: PRIVATE.
#     GET /api/v1/repos/capacium/capacium-models (authenticated) answers
#     {"private": true, "internal": false}; an anonymous request answers 403.
#   - GitHub mirror Capacium/capacium-models: PUBLIC.
#     GET https://api.github.com/repos/Capacium/capacium-models answers
#     {"private": false, "visibility": "public"}.
#
# credential_variable is measured on both runtimes in play. ops-engine 3.4.2,
# the tier-2 pin in capacium-ops, has no such field: it is silently dropped and
# adapters_for keys credentials by the forge value ("forgejo", "github").
# ops-engine 3.6.2, the PRD baseline, resolves each destination by
# credential_variable and falls back to the forge value, and its workflow
# supplies the keys FORGEJO_TOKEN and GH_MIRROR_TOKEN. Declaring the names
# therefore selects the same token on 3.6.2 and is inert on 3.4.2.
destinations:
  - forge: forgejo
    repo: capacium/capacium-models
    role: release
    visibility: private
    credential_variable: FORGEJO_TOKEN
  - forge: github
    repo: Capacium/capacium-models
    role: release
    visibility: public
    credential_variable: GH_MIRROR_TOKEN

# The organisation's canonical forge host (REL-023). The release gate reads it
# from here and hands it to the destination/host boundary gate, so a hardcoded
# canonical host in a workflow is refused. Keep the declaration on exactly one
# line: the extractor reads a single `forge_hosts:` line.
forge_hosts: [git.langevc.com]

# The release block whole (REA-010 / REA-015). The two distribution files that
# the PyPI publish already ships are declared here as assets of the release
# object, so the attach job in .github/workflows/publish.yml converges every
# release object on them with ops_engine.release_attach.
#
# A wheel is a ZIP container, so the wheel is declared with the type that names
# the file's form (github_release_zip); the sdist is a gzipped tarball
# (github_release_tarball). Both types sit in _RELEASE_ASSET_TYPES, so the
# engine reads them back as assets OF the release object. The <version>
# placeholder is the tag without its leading `v`, so the resolved names equal
# the PyPI file names of 1.1.1 exactly:
#   capacium_models-1.1.1-py3-none-any.whl
#   capacium_models-1.1.1.tar.gz
release:
  enabled: true
  trigger: tag_push
  tag_pattern: "v*"
  # Reproduces the existing v1.1.1 release title on both forges: the GitHub and
  # Forgejo release object for v1.1.1 is titled "Capacium Models v1.1.1".
  # render_release_name substitutes {tag_name} to give exactly that string.
  name_template: "Capacium Models {tag_name}"
  assets:
    - type: github_release_zip
      name: "capacium_models-<version>-py3-none-any.whl"
    - type: github_release_tarball
      name: "capacium_models-<version>.tar.gz"

# Deliberately NOT declared here:
#   - tracker_prefixes: the audience gate refuses nothing when the list is
#     empty, which is the documented default. Measured on 2026-11-17, this
#     repository's CHANGELOG.md carries no token of the gate's
#     [A-Z]{2,5}-<number> shape at all, so there is no vocabulary to declare;
#     a list invented here would refuse notes that name none of it.
#   - visibility_candidate_globs / visibility_exceptions: the Layer-2 entry in
#     capacium-ops/config.yml owns them; a Layer-3 list would REPLACE that list
#     on merge, and the globs must cover the mirror destination the gate judges.
#   - release_body_install_block / release_body_assets_line: per-repository
#     business data, never engine defaults.
#
# v1.1.0 (RFL-030 decision, measured 2026-11-17): the annotated tag v1.1.0 (tag
# object a969bf2ceebc32969a6f99e55859cc5b31c7f06b, commit
# 2f67aaa595c20e3e573bb5902efa8edeb18e5079) is NOT moved, NOT deleted and NOT
# re-pointed. It is not an ancestor of main and is contained in no branch. Its
# commit is what PyPI shipped as capacium-models 1.1.0 (uploads at
# 2026-09-07T22:36:59Z, the tag commit's own timestamp), so it is the provenance
# of an immutable distribution artifact. It cannot carry a release object:
# CHANGELOG.md at that commit has no `## ... v1.1.0` section (its top section is
# v0.5.0), and the release workflow's notes extractor refuses such a tag with
# MissingChangelogEntryError before any release object exists. The decision is
# to cut the next release as v1.1.1 from main, which does carry the v1.1.0
# section; the version bump and the v1.1.1 changelog section are a later task,
# because CHANGELOG.md is outside this lane's write surface.
